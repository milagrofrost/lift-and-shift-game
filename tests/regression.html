<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lift &amp; Shift regression tests</title>
<style>
  :root{--bg:#0f171d;--ink:#e6edf3;--muted:#8aa0b0;--ok:#4cd07d;--bad:#ff5d4d}
  body{margin:0;padding:24px 16px;background:var(--bg);color:var(--ink);font:14px/1.5 ui-monospace,Consolas,monospace}
  h1{font-size:18px;margin:0 0 4px}
  #sum{margin:0 0 16px;color:var(--muted)}
  #sum.ok{color:var(--ok)} #sum.bad{color:var(--bad)}
  ol{padding-left:24px} li{margin:2px 0}
  .pass{color:var(--ok)} .fail{color:var(--bad)}
  .detail{color:var(--muted)}
  iframe{position:absolute;left:-9999px;width:960px;height:600px;border:0}
</style>
</head>
<body>
<h1>Lift &amp; Shift regression tests</h1>
<p id="sum">Running…</p>
<ol id="out"></ol>
<iframe id="game" title="game under test"></iframe>
<script>
/* Deterministic state checks for lift-and-shift.html.
   Serve the repo root over HTTP (python -m http.server) and open /tests/regression.html.
   The game is loaded into a hidden iframe with a small hook that exposes its internals; the frame loop never
   starts, so every check drives update() and the other functions by hand with a seeded Math.random.
   Results: the page title becomes "PASS n/n" or "FAIL k/n", and window.__RESULTS holds the details. */
const HOOK = 'newRun();titleScreen();requestAnimationFrame(frame);';
// a missing function becomes undefined (that test fails) instead of stopping the game from loading
const NAMES = ("outageBurn,migrateBurn,migrateMult,rollOffers,patchBotOdds,missShops,shownOffers,offerable,SNOOZE_CLIENTS,PITY_MAX,BREAK_CLIENTS,needsBreak,retroOptions,getClient,haz,UPGRADES,newRun,startSprint,engagementCfg,update,applyPatch,patchDue,tickOnPrem,engagementReady,migrate,cutoverOK,doGrab," +
  "tickEscalation,cancelDeadCopies,useFreeze,startFreeze,freezeActive,liveCopy,slotUnder,rackUnder,RACKS,SLOTS,DESK," +
  "moverBot,mkBot,tickChatbots,spawnChatbots,tickTemp,devRun,devSet,DEV,keys,uptimeRegen,uptimeCap,tickManager,musicHeat,tickHazards,stick,stickVector,wantMood,SONG_SETS,MOODS,agentOdds,agentFixOdds,agentPick,tickAgent,AGENT_LV,AGENT_FOUNDATIONS,BK,restoresForRun,setDifficulty,RESTORE_TIME,BACKUP_EVERY,backupTick,bkPoints,logEv,beginRestore,tickRestore,devShow,devClose,showEnd,resign,shareFacts,sharePostText,shareLink,shareAct,SHARE,SHARE_NETS,SHARE_URL,shareCode,TITLES,verdict,notMyProblem,tickUsers,tickShouts,RANKS,HUMAN_LINES").split(",");
const EXPOSE = 'window.__G={get S(){return S},get mode(){return mode},setMode:m=>{mode=m},' +
  NAMES.map(n => `${n}:(typeof ${n}!=="undefined"?${n}:undefined)`).join(",") + '};newRun();titleScreen();';

let W, G, REPORT;
const tests = [];
const test = (name, fn) => tests.push({name, fn});
const check = (cond, msg) => { if (!cond) throw new Error(msg || "check failed"); };
const near = (a, b, eps = 1e-6) => Math.abs(a - b) <= eps;

// seeded RNG (mulberry32) so every run takes the same path
function seed(n) {
  let t = n >>> 0;
  W.Math.random = () => { t += 0x6D2B79F5; let r = Math.imul(t ^ t >>> 15, 1 | t); r ^= r + Math.imul(r ^ r >>> 7, 61 | r); return ((r ^ r >>> 14) >>> 0) / 4294967296; };
}
const fixedRandom = v => { W.Math.random = () => v; };

// a fresh first client: no users in the way, every rack known, all timers healthy
function fresh({bluegreen = false, sprint = 1, reveal = true, s = 1} = {}) {
  seed(s);
  G.newRun(); G.startSprint(sprint); G.setMode("play");
  const S = G.S;
  S.users = []; S.cbots = []; S.atk = []; S.tk = []; S.em = []; S.st = []; S.sp = []; S.temp = null;
  S.upgrades.bluegreen = bluegreen;
  S.racks.forEach(a => { if (!a) return; if (reveal) a.hidden = false; a.fire = 0; a.down = false; a.covered = false; a.timer = a.maxT; });
  seed(s + 1000);
  return S;
}
const firstRack = S => S.racks.find(a => a && a.tier === "bronze" && !a.hidden) || S.racks.find(a => a && !a.hidden);
const standAt = (S, p, dx = 0, dy = 0) => { S.p.x = p.x + dx; S.p.y = p.y + dy; };

/* ---------- source ---------- */
let SRC = "";
test("every inline script parses", () => {
  const doc = new DOMParser().parseFromString(SRC, "text/html");
  const scripts = [...doc.querySelectorAll("script:not([src])")];
  check(scripts.length > 0, "no inline scripts found");
  scripts.forEach((sc, i) => { try { new Function(sc.textContent); } catch (e) { throw new Error(`script #${i + 1}: ${e.message}`); } });
});

/* ---------- patch cycles ---------- */
test("a patch early, mid or late covers the current cycle without moving its deadline", () => {
  for (const frac of [0.95, 0.5, 0.05]) {
    const S = fresh(); const a = firstRack(S);
    a.timer = a.maxT * frac; const before = a.timer;
    check(G.applyPatch(a), `patch at ${frac} rejected`);
    check(a.covered && a.timer === before, `patch at ${frac} moved the timer or didn't cover`);
  }
});
test("a redundant patch on a covered server is rejected", () => {
  const S = fresh(); const a = firstRack(S);
  G.applyPatch(a); check(!G.applyPatch(a), "second patch accepted"); check(!G.patchDue(a), "covered server still due");
});
test("a covered cycle ends into a fresh uncovered one with no audit", () => {
  const S = fresh(); const a = firstRack(S);
  a.covered = true; a.timer = 0.01; const audits = S.ss.audits, spent = S.cost.audits || 0;
  G.tickOnPrem(0.05);
  check(!a.covered && near(a.timer, a.maxT), "cycle did not reset uncovered");
  check(S.ss.audits === audits && (S.cost.audits || 0) === spent, "covered expiry was audited");
});
test("an uncovered cycle that expires fails its audit", () => {
  const S = fresh(); const a = firstRack(S);
  a.timer = 0.01; const audits = S.ss.audits;
  G.tickOnPrem(0.05);
  check(S.ss.audits === audits + 1, "no audit failure recorded");
});

/* ---------- completion and accounting ---------- */
test("an outage or breach in the cloud blocks client completion", () => {
  const S = fresh();
  S.racks = Array(12).fill(null); S.wave = [];
  S.cloud[0] = {name: "x", tier: "bronze", down: true}; check(!G.engagementReady(), "completed with a cloud outage");
  S.cloud[0] = {name: "x", tier: "bronze", breach: true}; check(!G.engagementReady(), "completed with an active breach");
  S.cloud[0] = {name: "x", tier: "bronze", leakOn: true, leak: 50}; check(G.engagementReady(), "a developing leak blocked completion");
});
test("a license pauses in transit, resumes on return, and keeps running under blue-green", () => {
  const setup = () => { const S = fresh(); S.racks.filter(Boolean).forEach(x => { x.lic = 0; x.timer = 999; x.covered = true; }); const a = firstRack(S); a.lic = 1; a.licBase = 20; S.cost.license = 0; return {S, a, slot: a.slot}; };
  let {S, a, slot} = setup();
  S.racks[slot] = null; S.carry = a; G.tickOnPrem(2);
  check(a.lic === 1 && !S.cost.license, `carried: lic ${a.lic}, cost ${S.cost.license}`);
  S.carry = null; S.pipe = [{a, t: 0, dur: 6, lane: 0}]; G.tickOnPrem(2);
  check(a.lic === 1 && !S.cost.license, `pipeline: lic ${a.lic}, cost ${S.cost.license}`);
  S.pipe = []; const b = G.mkBot("move"); b.carry = a; S.bots = [b]; G.tickOnPrem(2);
  check(a.lic === 1 && !S.cost.license, `bot: lic ${a.lic}, cost ${S.cost.license}`);
  b.carry = null; S.racks[slot] = a; G.tickOnPrem(0.5);
  check(near(a.lic, 0.5) && !S.cost.license, `resumed: lic ${a.lic}`);
  G.tickOnPrem(1);
  check(a.lic === 0 && S.cost.license > 0, "no renewal after returning");
  ({S, a, slot} = setup()); S.upgrades.bluegreen = true; S.carry = a; G.tickOnPrem(2);
  check(a.lic === 0 && S.cost.license > 0, "blue-green original skipped its renewal");
});
test("a failed cutover pays no savings and keeps the license; success pays once", () => {
  const S = fresh(); const a = firstRack(S); a.lic = 30; a.licBase = 20;
  standAt(S, G.RACKS[a.slot]); G.doGrab();
  standAt(S, G.SLOTS[4]); fixedRandom(0.999); G.doGrab();
  check(S.cloud[4] && S.cloud[4].down, "cutover did not fail");
  check(!(S.cost.savings) && a.lic === 30, "failed cutover paid savings or cleared the license");
  G.cutoverOK(S.cloud[4]); G.cutoverOK(S.cloud[4]);
  check(S.cost.savings === -4 && a.lic === 0, `savings ${S.cost.savings}, license ${a.lic}`);
});

/* ---------- carrying, put-back and escalations ---------- */
test("you must stand on an empty cloud slot to drop a server", () => {
  const S = fresh(); const a = firstRack(S);
  standAt(S, G.RACKS[a.slot]); G.doGrab(); check(S.carry === a && !S.racks[a.slot], "grab failed");
  S.p.x = 620; S.p.y = 530; G.doGrab(); check(S.carry === a, "dropped while not on a slot");
  standAt(S, G.SLOTS[5], 10, 10); fixedRandom(0); G.doGrab();
  check(!S.carry && S.cloud[5] && S.cloud[5].orig === a, "did not land in the slot underfoot");
});
test("an escalation waits while its server is carried and follows it to a new rack", () => {
  const S = fresh(); const a = firstRack(S); const old = a.slot; const empty = S.racks.findIndex(x => !x);
  standAt(S, G.RACKS[old]); G.doGrab();
  const e = {x: G.DESK.x, y: G.DESK.y, a}; S.atk.push(e);
  for (let k = 0; k < 200; k++) G.tickEscalation(e, 0.05);
  check(!e.dead && e.waiting && a.fire === 0, "escalation hit or vanished while the server was carried");
  standAt(S, G.RACKS[empty]); G.doGrab();
  check(S.racks[empty] === a && a.slot === empty, "put-down into a different rack failed");
  for (let k = 0; k < 200 && !e.dead; k++) G.tickEscalation(e, 0.05);
  check(e.dead && a.fire > 0, "escalation did not follow the server");
});
test("a successful migration retires the server's escalation", () => {
  const S = fresh(); const a = firstRack(S);
  standAt(S, G.RACKS[a.slot]); G.doGrab();
  const e = {x: G.DESK.x, y: G.DESK.y, a}; S.atk.push(e);
  standAt(S, G.SLOTS[2]); fixedRandom(0); G.doGrab();
  G.tickEscalation(e, 0.05); check(e.dead && a.fire === 0, "escalation survived the migration");
});
test("an escalation with nothing on-prem fizzles for $4k", () => {
  const S = fresh(); S.racks = Array(12).fill(null); S.carry = null; S.pipe = []; S.bots = [];
  const b0 = S.budget, e = {x: 480, y: 480, a: null}; G.tickEscalation(e, 0.05);
  check(e.dead && near(b0 - S.budget, 4), "escalation did not fizzle");
});
test("a forced put-back never overwrites a rack someone else now uses", () => {
  const S = fresh(); const a = firstRack(S), slot = a.slot;
  standAt(S, G.RACKS[slot]); G.doGrab();
  const intruder = {...a, name: "Intruder", slot}; S.racks[slot] = intruder;
  S.racks.find(x => x && x !== intruder).down = true; G.update(0.05);
  check(S.racks[slot] === intruder && S.racks.includes(a) && !S.carry, "carried server overwrote a rack or was lost");
});

/* ---------- mover bot ---------- */
test("with a pipeline the Mover Bot only uses free lanes and waits when they are busy", () => {
  const atRack = S => { const a = firstRack(S), p = G.RACKS[a.slot], b = G.mkBot("move"); b.x = p.x; b.y = p.y + 44; b.tgt = a; b.work = 0.99; S.bots = [b]; return {a, b}; };
  let S = fresh(); S.upgrades.pipeline = 1; let {a, b} = atRack(S);
  G.moverBot(b, 0.05, false, 85);
  check(S.pipe.length === 1 && S.pipe[0].a === a && S.pipe[0].byBot && !b.carry && !S.racks[a.slot], "bot did not use the free lane");
  S = fresh(); S.upgrades.pipeline = 1; ({a, b} = atRack(S)); S.pipe = [{a: {}, t: 0, dur: 6, lane: 0}];
  G.moverBot(b, 0.05, false, 85);
  check(!b.carry && S.pipe.length === 1 && S.racks[a.slot] === a && b.tgt === a && b.work === 0, "bot did not wait at its server for a free lane");
  const slot = a.slot; S.racks[slot] = null; S.carry = a; G.moverBot(b, 0.05, false, 85);
  check(b.tgt && b.tgt !== a && !b.carry, "bot did not move on after the player took its server");
  S = fresh(); S.upgrades.pipeline = 1; b = G.mkBot("move"); b.x = 480; b.y = 470; S.bots = [b]; S.pipe = [{a: {}, t: 0, dur: 6, lane: 0}];
  G.moverBot(b, 0.05, false, 85);
  check(b.tgt && (b.x !== 480 || b.y !== 470), "bot stayed at its resting spot with servers left");
  S = fresh(); ({a, b} = atRack(S));
  G.moverBot(b, 0.05, false, 85);
  check(b.carry === a && S.pipe.length === 0, "bot used a pipeline that doesn't exist");
});

/* ---------- chatbots ---------- */
test("two chatbots never fight over one user, and the conversation finishes", () => {
  const S = fresh(); S.upgrades.chatbot = 2; const u = {x: 480, y: 300, rank: 0}; S.users = [u]; G.spawnChatbots();
  S.cbots.forEach(c => { c.x = 480; c.y = 300; });
  fixedRandom(0.5); G.tickChatbots(0.05);
  const owner = u.chat; check(owner, "no bot started the conversation");
  for (let k = 0; k < 20; k++) G.tickChatbots(0.05);
  check(u.chat === owner && owner.chatT > 0.9, `conversation restarted: chatT ${owner.chatT}`);
  check(S.cbots.filter(c => c.tgt === u).length === 1, "second bot kept targeting the same user");
  for (let k = 0; k < 40 && !u.gone; k++) G.tickChatbots(0.05);
  check(u.gone, "the user was never resolved");
});
test("respawning chatbots releases anyone they were talking to", () => {
  const S = fresh(); S.upgrades.chatbot = 1; const u = {x: 480, y: 300, rank: 0, chat: {}}; S.users = [u];
  G.spawnChatbots(); check(!u.chat, "user left frozen by a bot that no longer exists");
});
test("a user who rejects the chatbot runs around frantic, yells for a human, then calms down", () => {
  const S = fresh(); S.upgrades.chatbot = 1; const u = {x: 480, y: 300, rank: 1, vx: 0, vy: 0, turn: 5, cd: 0, line: ""}; S.users = [u]; G.spawnChatbots();
  S.p.x = 100; S.p.y = 100; S.alert = false;
  S.cbots[0].x = 480; S.cbots[0].y = 300;
  fixedRandom(0.5); G.tickChatbots(0.05); check(u.chat, "no conversation started");
  fixedRandom(0.01); u.chat.chatT = 99; G.tickChatbots(0.05);
  check(!u.gone && !u.chat && u.frantic > S.t && G.HUMAN_LINES.includes(u.shout), "rejection did not send the user frantic");
  check(G.HUMAN_LINES.includes("Representative! Representative!"), "no Representative line");
  G.tickUsers(0.05); check(u.panic && Math.abs(u.vx) > 18, `not running around: panic ${u.panic} vx ${u.vx}`);
  S.t = u.frantic + 0.1; u.turn = 0; G.tickUsers(0.05); check(!u.panic, "still frantic after the window");
});

/* ---------- hallway users ---------- */
test("an intern blurts a question in passing instead of holding you; an analyst still holds you", () => {
  check(G.RANKS[0].name === "Intern" && G.RANKS[0].hold === 0 && G.RANKS[1].hold > 0, "rank table changed");
  for (const rank of [0, 1]) {
    const S = fresh(); S.alert = false; S.pizza = null; S.p.userImm = 0; S.p.ghost = 0; S.p.heldBy = null; S.p.stun = 0;
    const u = {x: S.p.x, y: S.p.y, rank, vx: 0, vy: 0, turn: 5, cd: 0, line: ""}; S.users = [u];
    const held = S.run.held; fixedRandom(0.5); G.tickUsers(0.01);
    if (rank === 0) check(!S.p.heldBy && S.p.stun === 0 && S.run.held === held && u.shoutT > 0 && u.cd > 0, "the intern stopped you");
    else check(S.p.heldBy === u && S.p.stun > 0, "the analyst didn't stop you");
  }
});

/* ---------- temp workers ---------- */
test("a temp investigates an unknown rack 10-75%, once, and never reveals it", () => {
  for (const [roll, frac] of [[0.01, 0.1065], [0.5, 0.425], [0.999, 0.74935]]) {
    const S = fresh({reveal: false}); const h = S.racks.find(a => a && a.hidden), p = G.RACKS[h.slot];
    check(h, "no hidden server");
    S.temp = {name: "Temp", x: p.x, y: p.y + 44, t: 20, work: 2.19, asked: true, snack: false, idle: 0, sayT: 5, wT: 1, wx: 480, wy: 400, tgt: {kind: "discover", a: h}};
    fixedRandom(roll); G.tickTemp(0.05);
    check(h.hidden && h.tempChecked, "temp revealed it or did not mark it");
    check(near(h.disc, 6 * frac, 1e-6), `progress ${h.disc} at roll ${roll}`);
    const after = h.disc; fixedRandom(0.5); G.tickTemp(0.05);
    check(!(S.temp.tgt && S.temp.tgt.kind === "discover" && S.temp.tgt.a === h) && h.disc === after, "temp went back to the same rack");
  }
});

/* ---------- ticket escalation pressure ---------- */
const fullQueue = S => { S.tk = [{age: 0}, {age: 0}, {age: 0}, {age: 0}, {age: 0}]; };
const runQueue = (S, seconds, refill = true) => { for (let t = 0; t < seconds - 1e-9; t += 0.05) { if (refill) fullQueue(S); S.atk = []; G.tickHazards(0.05); } }; // escalations in flight are dropped so only the queue timing is measured
test("escalations are 12 seconds of full queue apart, and a dip below full doesn't reset the wait", () => {
  const S = fresh(); const e0 = S.ss.esc;
  runQueue(S, 2.1); check(S.ss.esc === e0 + 1, `first escalation: ${S.ss.esc - e0}`);
  runQueue(S, 5); check(S.ss.esc === e0 + 1, "second escalation came too soon");
  S.tk = [{age: 0}]; runQueue(S, 1, false); check(S.escT > 6, `dip reset the wait to ${S.escT}`);
  runQueue(S, 7.2); check(S.ss.esc === e0 + 2, `after the full wait: ${S.ss.esc - e0}`);
});
test("escalations run at half speed during fires and quarter speed during outages", () => {
  let S = fresh(); firstRack(S).fire = 30; let e0 = S.ss.esc; S.escT = 1;
  runQueue(S, 1.8); check(S.ss.esc === e0, "fire did not slow escalation");
  runQueue(S, 0.4); check(S.ss.esc === e0 + 1, "escalation stalled during a fire");
  S = fresh(); firstRack(S).fire = 30; S.racks.filter(a => a && !a.hidden)[1].down = true; e0 = S.ss.esc; S.escT = 1;
  runQueue(S, 3.8); check(S.ss.esc === e0, "outage rate did not take precedence over the fire rate");
  runQueue(S, 0.4); check(S.ss.esc === e0 + 1, "escalation stalled during an outage");
});

/* ---------- uptime recovery and the manager ---------- */
test("uptime recovers unless gold is down or something is breached, and stops at its cap", () => {
  const S = fresh(); S.err = S.errMax * 0.1;
  check(near(G.uptimeRegen(), S.errMax * 0.002), `base rate ${G.uptimeRegen()}`);
  const a = firstRack(S); a.down = true; check(G.uptimeRegen() > 0, "a bronze outage stopped recovery"); a.down = false;
  const g = S.racks.find(x => x && x.tier === "gold"); g.down = true; check(G.uptimeRegen() === 0, "recovered during a gold outage"); g.down = false;
  S.cloud[0] = {name: "x", tier: "bronze", breach: true}; check(G.uptimeRegen() === 0, "recovered during a breach"); S.cloud[0] = null;
  S.err = S.errMax * 0.5; check(G.uptimeRegen() === 0, "recovered past half the budget");
  S.err = S.errMax * 0.8; const before = S.err; S.users = []; G.update(0.05); check(S.err <= before, "update raised uptime above the cap");
});
test("offline servers burn uptime by tier: gold most, bronze barely", () => {
  for (const [tier, rate] of [["gold", 3], ["silver", 1], ["bronze", 0.25]]) {
    const S = fresh(); S.racks.forEach(a => { if (a) a.down = false; });
    const a = S.racks.find(x => x && x.tier === tier); check(a, `no ${tier} server`);
    a.down = true; const before = S.err; G.tickOnPrem(1);
    check(near(before - S.err, rate), `${tier} burned ${before - S.err}`);
  }
});
test("Redefine Uptime raises the rate and cap; a manager raises the rate", () => {
  const S = fresh(); S.err = S.errMax * 0.1;
  const base = G.uptimeRegen();
  S.upgrades.spin = 3; check(G.uptimeRegen() > base && near(G.uptimeCap(), S.errMax * 0.95), `spin cap ${G.uptimeCap()}`);
  S.upgrades.spin = 0; S.upgrades.manager = 1; check(G.uptimeRegen() > base && near(G.uptimeCap(), S.errMax * 0.5), "manager changed the wrong thing");
});
test("a manager looking at a server takes it offline half the time", () => {
  for (const [roll, breaks] of [[0.4, true], [0.6, false]]) {
    const S = fresh(); S.upgrades.manager = 1; const a = firstRack(S), p = G.RACKS[a.slot];
    S.mgr = {x: p.x, y: p.y + 44, state: "patch", tgt: a, work: 3.99, dec: 5, say: "", sayT: 0, wx: 480, wy: 300};
    fixedRandom(roll); G.tickManager(0.05);
    check(a.down === breaks && S.mgr.state === (breaks ? "shame" : "idle"), `roll ${roll}: down ${a.down}, state ${S.mgr.state}`);
  }
});
const mgrAtRack = (S, a, work) => { const p = G.RACKS[a.slot]; S.mgr = {x: p.x, y: p.y + 44, state: "patch", tgt: a, work, dec: 5, say: "", sayT: 0, wx: 480, wy: 300}; return p; };
test("each server the manager breaks makes the cooldown longer, and it blocks more visits", () => {
  const S = fresh(); S.upgrades.manager = 1; const a = firstRack(S); S.users = [];
  const seen = [];
  for (let n = 0; n < 3; n++) {
    a.down = false; a.fire = 0; mgrAtRack(S, a, 3.99); S.mgrShame = 0;
    fixedRandom(0.4); G.tickManager(0.05); seen.push(S.mgrShame);
    check(S.mgr.state === "shame", "no walk of shame");
  }
  check(near(seen[0], 45) && near(seen[1], 90) && near(seen[2], 135), `cooldowns ${seen}`);
  S.mgrBreaks = 50; a.down = false; mgrAtRack(S, a, 3.99); fixedRandom(0.4); G.tickManager(0.05);
  check(near(S.mgrShame, 300), `cap ${S.mgrShame}`);
  a.down = false; S.em = []; S.mgr.state = "idle"; S.mgr.dec = 0;
  fixedRandom(0); G.tickManager(0.05);

test("restore brings state back, reverts later rows, and spends one charge", () => {

});

/* ---------- runner ---------- */
async function run() {
  const out = document.getElementById("out"), sum = document.getElementById("sum");
  const results = [];
  try {
    SRC = await fetch("../lift-and-shift.html", {cache: "no-store"}).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); });
  } catch (e) {
    sum.textContent = `Could not load ../lift-and-shift.html (${e.message}). Serve the repo root over HTTP.`; sum.className = "bad"; document.title = "FAIL load"; return;
  }
  if (!SRC.includes(HOOK)) { sum.textContent = "The game's start-up line changed; update HOOK in tests/regression.html."; sum.className = "bad"; document.title = "FAIL hook"; return; }
  const record = (name, ok, detail = "") => {
    results.push({name, ok, detail});
    const li = document.createElement("li");
    li.innerHTML = `<span class="${ok ? "pass" : "fail"}">${ok ? "PASS" : "FAIL"}</span> ${name}${detail ? ` <span class="detail">— ${detail}</span>` : ""}`;
    out.appendChild(li);
  };
  const runOne = async t => { let ok = true, detail = ""; try { await t.fn(); } catch (e) { ok = false; detail = e.message; } record(t.name, ok, detail); };
  // the syntax check needs no running game, so it always runs first
  await runOne(tests[0]);
  REPORT = await import("../functions/_lib/report.js");
  const frame = document.getElementById("game");
  await new Promise(res => { frame.onload = res; frame.srcdoc = SRC.replace(HOOK, EXPOSE); });
  W = frame.contentWindow; G = W.__G;
  if (G) G.setDifficulty("normal", false);
  if (!G) record("the game starts inside the test frame", false, "it did not start; see the console");
  else {
    const realRandom = W.Math.random;
    for (const t of tests.slice(1)) { await runOne(t); W.Math.random = realRandom; }
  }
  const failed = results.filter(r => !r.ok).length;
  sum.textContent = failed ? `${failed} of ${results.length} failed` : `All ${results.length} passed`;
  sum.className = failed ? "bad" : "ok";
  document.title = failed ? `FAIL ${failed}/${results.length}` : `PASS ${results.length}/${results.length}`;
  window.__RESULTS = results;
}
run();
