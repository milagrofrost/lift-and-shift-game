<script>
/* Deterministic state checks for lift-and-shift.html.
   Serve the repo root over HTTP (python -m http.server) and open /tests/regression.html.
   The game is loaded into a hidden iframe with a small hook that exposes its internals; the frame loop never
   starts, so every check drives update() and the other functions by hand with a seeded Math.random.
   Results: the page title becomes "PASS n/n" or "FAIL k/n", and window.__RESULTS holds the details. */
const HOOK = 'newRun();titleScreen();requestAnimationFrame(frame);';
// a missing function becomes undefined (that test fails) instead of stopping the game from loading
const NAMES = ("spawns,inboxLimit,importantMail,cloudSpend,tickFinops,approveNear,tickAgent,agentPick,jiggler,cloudRate,burnRate,outageBurn,migrateBurn,migrateMult,rollOffers,patchBotStocked,missShops,shownOffers,PITY_MAX,BREAK_CLIENTS,needsBreak,isBreak,stage,CLIENTS,retroOptions,getClient,haz,UPGRADES,newRun,startSprint,engagementCfg,update,applyPatch,patchDue,tickOnPrem,engagementReady,migrate,cutoverOK,doGrab," +
  "tickEscalation,cancelDeadCopies,useFreeze,startFreeze,freezeActive,liveCopy,slotUnder,rackUnder,RACKS,SLOTS,DESK," +
  "moverBot,mkBot,tickChatbots,spawnChatbots,tickTemp,devRun,devSet,DEV,keys,uptimeRegen,uptimeCap,tickManager,musicHeat,tickHazards,stick,stickVector,wantMood,SONG_SETS,MOODS,agentOdds,agentFixOdds,agentPick,tickAgent,AGENT_LV,AGENT_FOUNDATIONS,BK,restoresForRun,setDifficulty,RESTORE_TIME,BACKUP_EVERY,backupTick,bkPoints,logEv,beginRestore,tickRestore,devShow,devClose,showEnd,resign,shareFacts,sharePostText,shareLink,shareAct,SHARE,SHARE_NETS,SHARE_URL,shareCode,TITLES,verdict,carnageRows,notMyProblem,tickUsers,tickShouts,RANKS,HUMAN_LINES,financeExtension,finishEngagement,doFix,spawnManager,canBuy,discoverTime,ticketLimit,rollCredits,creditsDone,CREDITS,ALERT_SLOW,slowDepth,doorOpen,doorCross,spawnTemp,SFX,AU,outsourced,skilledShare,OUTSOURCE_FROM,START_GRACE,toolkitHtml,show,ROUTINE,cleanAvatar,setAvatar,titleScreen,LEARN,learnMore,aboutAuthor,AUTHOR_LINKS,hideTip,creditsOld,clipTwin,clipEv,clipReset,tickClip,CLIP_LINES,CLIP_SHOP,clipMood,CLIP_SVG,TUT,tutorial,TUTOR,tutTick,tutAck,tutGrabOK,tutDone,buy,review,INBOX,handsOn,hud").split(",");
const EXPOSE = 'window.__G={get S(){return S},get mode(){return mode},setMode:m=>{mode=m},' +
  NAMES.map(n => `${n}:(typeof ${n}!=="undefined"?${n}:undefined)`).join(",") + '};newRun();titleScreen();';

let W, G, REPORT;
const tests = [];
const test = (name, fn) => tests.push({name, fn});
const check = (cond, msg) => { if (!cond) throw new Error(msg || "check failed"); };
const near = (a, b, eps = 1e-6) => Math.abs(a - b) <= eps;

// seeded RNG (mulberry32) so every run takes the same path
function seed(n) {
  let t = n >>> 0;
  W.Math.random = () => { t += 0x6D2B79F5; let r = Math.imul(t ^ t >>> 15, 1 | t); r ^= r + Math.imul(r ^ r >>> 7, 61 | r); return ((r ^ r >>> 14) >>> 0) / 4294967296; };
}
const fixedRandom = v => { W.Math.random = () => v; };

// a fresh first client: no users in the way, every rack known, all timers healthy
function fresh({bluegreen = false, sprint = 1, reveal = true, s = 1} = {}) {
  seed(s);
  G.newRun(); G.startSprint(sprint); G.setMode("play");
  const S = G.S;
  S.users = []; S.cbots = []; S.atk = []; S.tk = []; S.em = []; S.st = []; S.sp = []; S.temp = null;
  S.upgrades.bluegreen = bluegreen;
  S.racks.forEach(a => { if (!a) return; if (reveal) a.hidden = false; a.fire = 0; a.down = false; a.covered = false; a.timer = a.maxT; });
  seed(s + 1000);
  return S;
}
const firstRack = S => S.racks.find(a => a && a.tier === "bronze" && !a.hidden) || S.racks.find(a => a && !a.hidden);
const standAt = (S, p, dx = 0, dy = 0) => { S.p.x = p.x + dx; S.p.y = p.y + dy; };

/* ---------- source ---------- */
let SRC = "";
test("every inline script parses", () => {
  const doc = new DOMParser().parseFromString(SRC, "text/html");
  const scripts = [...doc.querySelectorAll("script:not([src])")];
  check(scripts.length > 0, "no inline scripts found");
  scripts.forEach((sc, i) => { try { new Function(sc.textContent); } catch (e) { throw new Error(`script #${i + 1}: ${e.message}`); } });
});

test("paperclip reactions follow events without changing the run or random odds", () => {
  G.newRun(true);const S=G.S;
  check(!G.clipMood().wide&&!G.clipMood().quake&&!G.clipMood().closed&&!G.clipMood().roll&&!G.clipMood().tear,"idle face reacts");
  S.p.boost=4;check(G.clipMood().wide,"coffee eyes missing");S.p.boost=0;
  S.alert=true;check(G.clipMood().quake,"red alert reaction missing");
  // long eye shuts with quick peeks: shut for most of each 2.4s cycle, open for the rest
  let shut=0;for(let k=0;k<240;k++){S.t=k*0.01;if(G.clipMood().shut)shut++;}
  check(shut>=150&&shut<240,`red alert eyes should stay shut most of the cycle with a peek, shut ${shut}/240`);
  S.alert=false;S.t=0.5;check(!G.clipMood().shut,"eyes stay squeezed shut after the red alert");
  // a real spray: stand at a burning rack and hold E, the way the game does it
  const r=S.racks.find(x=>x&&!x.hidden);r.fire=40;S.p.x=G.RACKS[r.slot].x;S.p.y=G.RACKS[r.slot].y;S.p.stun=0;S.p.inv=0;S.energy=100;
  G.keys.fix=true;G.doFix(.05);check(r.fire<40,"test setup: the fire wasn't being sprayed");check(G.clipMood().closed,"firefighting eyes open while the extinguisher sprays");
  G.keys.fix=false;G.doFix(.05);S.t+=0.2;check(!G.clipMood().closed,"eyes stay closed after the spray stops");r.fire=0;
  S.p.heldBy={};S.p.stun=2;check(G.clipMood().roll,"hallway eye roll missing");S.p.stun=0;check(!G.clipMood().roll,"eye roll outlasts interruption");
  S.tut.i=G.TUTOR.findIndex(s=>s.emotion==="leak");check(G.clipMood().tear,"leak tear missing");
  const before=JSON.stringify(S),random=W.Math.random;W.Math.random=()=>{throw new Error("cosmetic reaction consumes RNG");};
  try{G.clipMood();check(JSON.stringify(S)===before,"face changed game state");}finally{W.Math.random=random;}
  S.tut.i++;check(!G.clipMood().tear,"tear outlasts leak lesson");
});

test("tutorial: the clock runs, compliance waits, and a fire burns through a little slower than usual", () => {

test("tutorial: a staged leak grows a little slower than usual, still breaches into a red alert, and never spreads", () => {
  G.newRun(true);G.setMode("play");const S=G.S;
  const apps=S.racks.filter(x=>x&&!x.hidden).slice(0,2);G.migrate(apps[0],0,false);G.migrate(apps[1],1,false);
  check(S.cloud[0]&&!S.cloud[0].down&&S.cloud[1]&&!S.cloud[1].down,"test setup: tutorial cutovers failed");
  const c=S.cloud[0];c.leakOn=true;c.leak=25;
  for(let i=0;i<100;i++)G.update(.1);
  check(c.leak>25+3.6*10*0.6&&c.leak<25+3.6*10*0.9,`tutorial leak should grow at about 75% speed, got ${c.leak}`);
  for(let i=0;i<400&&!c.breach;i++)G.update(.1);
  check(c.breach,"a tutorial leak never became a breach");
  G.update(.1);check(S.alert,"a tutorial breach didn't raise a red alert");
  for(let i=0;i<300;i++)G.update(.1);
  check(!S.cloud[1].breach,"a tutorial breach spread to its neighbour");
});

  const S=fresh();const u=G.UPGRADES.find(x=>x.id==="clip");

  S.noAI=true;check(G.canBuy(u),"old school careers can't buy Mr Paperclip");S.noAI=false;
  S.energy=50;check(!G.clipEv("patch")&&S.energy===50,"he talks before he's hired");

    check(G.clipEv("patch")&&S.energy===51&&S.clipC.say&&G.CLIP_LINES.patch.includes(S.clipC.say),"his line or his +1 energy is missing");

/* ---------- patch cycles ---------- */
test("a patch early, mid or late covers the current cycle without moving its deadline", () => {
  for (const frac of [0.95, 0.5, 0.05]) {
    const S = fresh(); const a = firstRack(S);
    a.timer = a.maxT * frac; const before = a.timer;
    check(G.applyPatch(a), `patch at ${frac} rejected`);
    check(a.covered && a.timer === before, `patch at ${frac} moved the timer or didn't cover`);
  }
});
test("a redundant patch on a covered server is rejected", () => {
  const S = fresh(); const a = firstRack(S);
  G.applyPatch(a); check(!G.applyPatch(a), "second patch accepted"); check(!G.patchDue(a), "covered server still due");
});
test("a covered cycle ends into a fresh uncovered one with no audit", () => {
  const S = fresh(); const a = firstRack(S);
  a.covered = true; a.timer = 0.01; const audits = S.ss.audits, spent = S.cost.audits || 0;
  G.tickOnPrem(0.05);
  check(!a.covered && near(a.timer, a.maxT), "cycle did not reset uncovered");
  check(S.ss.audits === audits && (S.cost.audits || 0) === spent, "covered expiry was audited");
});
test("an uncovered cycle that expires fails its audit", () => {
  const S = fresh(); const a = firstRack(S);
  a.timer = 0.01; const audits = S.ss.audits;
  G.tickOnPrem(0.05);
  check(S.ss.audits === audits + 1, "no audit failure recorded");
});

/* ---------- completion and accounting ---------- */
test("an outage or breach in the cloud blocks client completion", () => {

test("FinOps: the scan flags a third of live apps with a $; tap or spray E to approve; re-flag up to twice; the agent approves at any level", () => {
  const S = fresh(), U = S.upgrades; S.lz = 0; S.lzW = 0;
  const app = (i, tier = "bronze", o = {}) => (S.cloud[i] = {name: "c" + i, tier, slot: i, leak: 0, ...o});
  S.cloud.fill(null);
  U.finops = true; S.sweepT = 0; G.tickFinops(0.01);
  check(!S.sweep && S.sweepT === 3, `empty cloud should retry in 3s, got ${S.sweepT}`);
  for (let i = 0; i < 6; i++) app(i, ["bronze", "silver", "gold"][i % 3]);
  app(6, "bronze", {down: true}); app(7, "bronze", {breach: true});
  U.finops = false; S.sweepT = 0; G.tickFinops(0.01); check(!S.sweep, "swept without FinOps");
  U.finops = true; S.freezeT = 5; G.tickFinops(0.01); check(!S.sweep, "swept during a freeze"); S.freezeT = 0;
  S.sweepT = 0; G.tickFinops(0.01);
  check(S.sweep && S.sweep.pick.length === 2 && S.sweep.pick.every(i => i < 6), `pick ${S.sweep && S.sweep.pick}`);
  check(S.sweepT >= 20 && S.sweepT <= 25, `next scan in ${S.sweepT}`);
  G.tickFinops(2); check(!S.sweep, "scan never finished");
  const flagged = S.cloud.map((a, i) => a && a.rsTag ? i : -1).filter(i => i >= 0);
  check(flagged.length === 2 && !S.cloud[6].rsTag && !S.cloud[7].rsTag, `flagged ${flagged}`);
  const base = G.cloudSpend();
  // tap: approve the one you stand at, once; the $ goes away
  standAt(S, G.SLOTS[flagged[0]]); S.ss.acts = 0; G.keys.fix = true;
  try { G.approveNear(); G.approveNear(); } finally { G.keys.fix = false; }
  const a0 = S.cloud[flagged[0]];
  check(a0.rs === 1 && !a0.rsTag && S.ss.acts === 1, `tap approval: rs ${a0.rs}, acts ${S.ss.acts}`);
  check(near(base - G.cloudSpend(), 0.13 * 0.19), "an approval should cut that app's cost by 19%");
  // spray: holding E while walking past several flagged apps approves each of them
  for (let i = 0; i < 6; i++) S.cloud[i].rsTag = true;
  G.keys.fix = true;
  try { for (let i = 0; i < 6; i++) { standAt(S, G.SLOTS[i]); G.approveNear(); } } finally { G.keys.fix = false; }
  check(S.cloud.slice(0, 6).every(a => a.rs >= 1 && !a.rsTag) && S.ss.acts === 7 && a0.rs === 2, `spray: acts ${S.ss.acts}, a0 ${a0.rs}`);
  check(near(base - G.cloudSpend(), 0.13 * (5 * 0.19 + 1 - 0.81 * 0.89)), "a second approval should cut that app another 11% (about 28% in all)");
  // the same app can be flagged again until it has two savings, then never again
  check(G.cloudSpend() > 0, "spend went to zero");
  for (let k = 0; k < 6; k++) { S.sweepT = 0; G.tickFinops(0.01); if (S.sweep) G.tickFinops(2); S.cloud.forEach(a => { if (a && a.rsTag) { a.rsTag = false; a.rs++; } }); }
  check(S.cloud.slice(0, 6).every(a => a.rs === 2), `rs counts ${S.cloud.slice(0, 6).map(a => a.rs)}`);
  S.sweepT = 0; G.tickFinops(0.01); check(!S.sweep, "scanned apps already at the cap");
  // the agent: level 1, gold app, no foundations, still approves
  S.cloud[2].rs = 1; S.cloud[2].rsTag = true; U.agent = 1; S.tk = []; S.em = [];
  S.racks.forEach(a => { if (a) { a.hidden = false; a.covered = true; a.timer = a.maxT; } });
  S.agent = {x: 0, y: 0, job: null, work: 0, say: "", sayT: 0, wx: 480, wy: 260, wT: 0};

  Object.assign(S.agent, {x: j.x, y: j.y, job: j});

  check(S.cloud[2].rs === 2 && !S.cloud[2].rsTag && (S.cost.ai || 0) > spent, "level 1 agent did not approve the gold app, or didn't bill tokens");
});

    check(tings === 1 && tingX < 360, `no audit: ${tings} tings, at x ${tingX}`); }
  // with it: three denials 3 s apart, a call, then access; the same with or without a red alert
  for (const alert of [false, true]) {
  const S = fresh(); S.upgrades.badge = true; S.p.x = 200; S.p.y = 280; S.p.lz = 0;
  if (alert) { S.alert = true; S.slow = 0.85; }
  const vp = vpAt(480, 280); S.users = [vp];
  const denials = []; let accessAt = -1, inAt = -1;
  for (let k = 0; k < 600 && !S.p.heldBy; k++) {
    const n = vp.badgeN || 0; S.p.x = 200; S.p.y = 280; S.t += 0.05; G.tickUsers(0.05);
    if ((vp.badgeN || 0) > n) denials.push(+(k * 0.05).toFixed(2));
    if (vp.access && accessAt < 0) accessAt = k * 0.05;
    if (inAt < 0 && vp.x < 360) inAt = k * 0.05;
    if (!vp.access) check(vp.x >= 382, `got in without access at x ${vp.x}`);
  }
  check(denials.length === 3 && near(denials[1] - denials[0], 3, 0.06) && near(denials[2] - denials[1], 3, 0.06), `alert ${alert}: denials ${denials}`);
  check(accessAt > denials[2] + 5.9 && accessAt < denials[2] + 6.1, `access at ${accessAt}, last denial ${denials[2]}`);
  check(inAt > accessAt && S.p.heldBy === vp, `alert ${alert}: in at ${inAt}, held ${!!S.p.heldBy}`);
  }
  // piggyback: right after you badge in, a VP without access can slip through the green door
  { const S = fresh(); S.upgrades.badge = true; S.p.x = 380; S.p.y = 280; S.p.lz = 1; const vp = vpAt(400, 280); vp.cd = 9; S.users = [vp];
    S.p.x = 340; G.doorCross(S.p, false); check(G.doorOpen(0), "your badge-in didn't open the door");
    for (let k = 0; k < 18; k++) { S.p.x = 300; S.p.y = 280; G.tickUsers(0.05); S.t += 0.05; }
    check(vp.x < 360 && !vp.access, `didn't piggyback: x ${vp.x}`); }
  // walking out opens the door too (silently)
  { const S = fresh(); S.p.x = 340; S.p.lz = 0; S.doorG = {};
    S.p.x = 380; G.doorCross(S.p, false);
    check(G.doorOpen(0) && !G.doorOpen(2), "walking out didn't turn the door green"); }
  check(G.UPGRADES.some(u => u.id === "badge"), "no Badge Access Audit in the shop");
});
test("temps badge in; one temp in ten is a dud, split between snack hoarders and never-onboarded", () => {
  const kind = r => { const S = fresh(); fixedRandom(r); G.spawnTemp(); seed(5); const T = S.temp; return T.snack ? "snack" : T.nobadge ? "nobadge" : "ok"; };
  check(kind(0.02) === "snack" && kind(0.07) === "nobadge" && kind(0.12) === "ok", `kinds ${kind(0.02)} ${kind(0.07)} ${kind(0.12)}`);
  // a normal temp walking into the server room opens the door
  { const S = fresh(); fixedRandom(0.5); G.spawnTemp(); seed(5); const T = S.temp; T.x = 380; T.y = 280; T.lz = 1; S.doorG = {};
    T.x = 340; G.doorCross(T, false); check(G.doorOpen(0), "the temp didn't badge in"); }
  // a never-onboarded temp gets denied every 3 s at the door, never gets in, does no work, and quits at 12 s
  const S = fresh(); fixedRandom(0.07); G.spawnTemp(); seed(5); const T = S.temp; T.asked = true;
  const rack = S.racks.find(a => a); rack.fire = 50;
  let denials = 0, quitAt = -1;
  for (let k = 0; k < 400 && S.temp; k++) {
    const no = (S.doorNo || {})[0] || 0; T.idle = 0; S.t += 0.05; G.tickTemp(0.05);
    if (((S.doorNo || {})[0] || 0) !== no) denials++;
    check(T.x >= 360, `no-badge temp got into the room at x ${T.x}`);
    if (T.quit && quitAt < 0) quitAt = k * 0.05;
  }
  check(near(quitAt, 12, 0.06) && denials >= 2 && rack.fire === 50, `quit ${quitAt}, denials ${denials}, fire ${rack.fire}`);
});
test("Mouse Jiggler: under 10% of the work over 3+ clients, but never zero; a hold-E job counts once", () => {
  const doc = W.document;
  let S = fresh(); S.tk = [{age: 0}, {age: 0}]; S.p.x = G.DESK.x; S.p.y = G.DESK.y; S.energy = 100; G.keys.fix = true;
  try { for (let i = 0; i < 10; i++) G.doFix(0.05); } finally { G.keys.fix = false; }
  check(S.ss.human >= 10 && S.ss.acts === 1, `one held job should be one action, got ${S.ss.acts}`);
  G.keys.fix = false; G.doFix(0.05); G.keys.fix = true;
  try { G.doFix(0.05); } finally { G.keys.fix = false; }
  check(S.ss.acts === 2, `pressing E again should be a new action, got ${S.ss.acts}`);
  const finish = (acts, bot, ai) => { Object.assign(S.ss, {human: acts, acts, bot}); S.ss.ai.n = ai; G.finishEngagement(); };
  const shown = () => [...doc.querySelectorAll("p")].some(p => p.textContent.includes("Mouse Jiggler"));
  // two clients isn't a career
  S = fresh(); finish(5, 60, 40); finish(5, 60, 40);
  check(G.jiggler() === null, "two clients should not be enough");
  finish(5, 60, 40);
  check(near(G.jiggler(), 15 / 315), `three clients at 5% should earn it, got ${G.jiggler()}`);
  G.showEnd(); check(shown() && doc.body.textContent.includes("You did 5% of the work"), "retirement screen is missing the Mouse Jiggler line");
  S = fresh(); finish(12, 60, 40); finish(12, 60, 40); finish(12, 60, 40);
  check(G.jiggler() === null, "11% of the work is honest work");
  S = fresh(); finish(0, 60, 40); finish(0, 60, 40); finish(0, 60, 40);
  check(G.jiggler() === null, "zero actions is the obsolete ending, not jiggling");
});

/* ---------- runner ---------- */
async function run() {
  const out = document.getElementById("out"), sum = document.getElementById("sum");
  const results = [];
  try {
    SRC = await fetch("../lift-and-shift.html", {cache: "no-store"}).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); });
  } catch (e) {
    sum.textContent = `Could not load ../lift-and-shift.html (${e.message}). Serve the repo root over HTTP.`; sum.className = "bad"; document.title = "FAIL load"; return;
  }
  if (!SRC.includes(HOOK)) { sum.textContent = "The game's start-up line changed; update HOOK in tests/regression.html."; sum.className = "bad"; document.title = "FAIL hook"; return; }
  const record = (name, ok, detail = "") => {
    results.push({name, ok, detail});
    const li = document.createElement("li");
    li.innerHTML = `<span class="${ok ? "pass" : "fail"}">${ok ? "PASS" : "FAIL"}</span> ${name}${detail ? ` <span class="detail">— ${detail}</span>` : ""}`;
    out.appendChild(li);
  };
  const runOne = async t => { let ok = true, detail = ""; try { await t.fn(); } catch (e) { ok = false; detail = e.message; } record(t.name, ok, detail); };
  // the syntax check needs no running game, so it always runs first
  await runOne(tests[0]);
  REPORT = await import("../functions/_lib/report.js");
  const frame = document.getElementById("game");
  await new Promise(res => { frame.onload = res; frame.srcdoc = SRC.replace(HOOK, EXPOSE).replace('<meta charset="utf-8">', '$&<base href="../">'); });
  W = frame.contentWindow; G = W.__G;
  if (G) G.setDifficulty("normal", false);
  if (!G) record("the game starts inside the test frame", false, "it did not start; see the console");
  else {
    const realRandom = W.Math.random;
    for (const t of tests.slice(1)) { await runOne(t); W.Math.random = realRandom; }
  }
  // silence the test frame once the checks are done: stop its music loop and close its audio, without
  // touching the saved music setting the real game shares with this origin
  if (W) { W.clearInterval(W.__liftShiftMusicTimer); if (W.__liftShiftAudio) W.__liftShiftAudio.close().catch(() => {}); }
  const failed = results.filter(r => !r.ok).length;
  sum.textContent = failed ? `${failed} of ${results.length} failed` : `All ${results.length} passed`;
  sum.className = failed ? "bad" : "ok";
  document.title = failed ? `FAIL ${failed}/${results.length}` : `PASS ${results.length}/${results.length}`;
  window.__RESULTS = results;
}
run();
